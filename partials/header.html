<!-- header.html -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
/* =========================
    HEADER CSS BRAND
========================= */
.brand-text {
    font-weight: 750;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 10px;
}

/* STACK TEXT VERTICALLY */
.brand-text-inner {
    display: flex;
    flex-direction: column;
    line-height: 1.1;
}

/* MAIN BRAND COLORS */
.brand-text .volt {
    color: #facc15;
}

.brand-text .masters {
    color: #d9ebff;
}

/* SUBTITLE */
.brand-subtitle {
    font-size: 18px;
    color: #d9ebff;
    letter-spacing: 1px;
    margin-top: 1px;
    margin-left: 2px;
}

/* LOGO IMAGE */
.brand-logo {
    width: 50px;
    height: 50px;
    object-fit: cover;
    border-radius: 50%;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}

/* =========================
   NAVBAR
========================= */
.navbar-custom {
    background: #0f172a;
    position: relative;
    z-index: 1050;
}

/* NAV LINKS */
.nav-link {
    font-size: 16px;
    font-weight: 600;
    transition: all 0.3s ease;
    position: relative;
    letter-spacing: 0.3px;
}

.nav-link:hover {
    color: #facc15 !important;
}

/* ACTIVE PAGE */
.nav-link.active-page {
    color: #facc15 !important;
    font-weight: 700;
}

.nav-link.active-page::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -6px;
    width: 100%;
    height: 2px;
    background: #facc15;
    border-radius: 10px;
}

/* =========================
   YELLOW ACCENT BAR
========================= */
.nav-accent-bar {
    height: 3px;
    width: 100%;
    background: linear-gradient(90deg, #facc15, #eab308, #facc15);
    box-shadow: 0 2px 10px rgba(250, 204, 21, 0.4);

    position: relative;
    z-index: 1;
    pointer-events: none;
}
.navbar-collapse {
    transition: all 0.3s ease;
}
.navbar-toggler {
    z-index: 1100;
}

@media (max-width: 420px) {
    .brand-text {
        flex-direction: column;
        align-items: flex-start;
    }

    .brand-logo {
        margin-bottom: 5px;
    }
}
@media (max-width: 991px) {
    .navbar-nav {
        background: #0f172a;
        padding: 15px;
        border-radius: 10px;
        margin-top: 10px;
    }

    .nav-link {
        font-size: 18px;
        padding: 10px 0;
    }
}

@media (max-width: 991px) {
    .navbar-collapse {
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: #0f172a;
        z-index: 1090;
        padding: 15px;
        border-radius: 0 0 10px 10px;
    }
}

</style>

<!-- =========================
     NAVBAR
========================= -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top shadow">

    <div class="container-fluid">

        <!-- LOGO -->
        <a class="navbar-brand brand-text" href="/">

            <!-- LOGO IMAGE -->
            <img src="img/logo.webp" alt="VoltMasters Logo" class="brand-logo">

            <!-- TEXT -->
            <span class="brand-text-inner">

                <span>
                    <span class="volt">VOLT</span><span class="masters">MASTERS</span>
                </span>

                <!-- SUBTITLE BELOW -->
                <small class="brand-subtitle">Engineering Services</small>

            </span>

        </a>

        <!-- MOBILE TOGGLER -->
        <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#navbarNav"
            aria-controls="navbarNav"
            aria-expanded="false"
            aria-label="Toggle navigation">

            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- NAVIGATION LINKS -->
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">

            <ul class="navbar-nav gap-lg-3 text-end">

                <li class="nav-item">
                    <a class="nav-link" href="/">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/about">About Us</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/purpose">Purpose</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/services">Services</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/clients">Clients</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/projects">Projects</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="/contact">Contact Us</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- YELLOW ACCENT BAR -->
<div class="nav-accent-bar"></div>

<!-- ACTIVE PAGE SCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", function () {

    const currentPage =
        window.location.pathname.split("/").pop() || "index.html";

    const navLinks = document.querySelectorAll(".nav-link");

    navLinks.forEach(link => {

        const linkHref = link.getAttribute("href");

        if (linkHref === currentPage) {
            link.classList.add("active-page");
        }

    });

});
</script>

<!-- BOOTSTRAP -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
